[package]
name = "api"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
domain = { version = "0.1.0", path = "../domain" }
dotenvy = "0.15.7"
envy = "0.4.2"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
rand_core_06 = { version = "0.6", package = "rand_core", features = ["getrandom"] }
rsa = { version = "0.9.10", features = ["pem"] }
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
